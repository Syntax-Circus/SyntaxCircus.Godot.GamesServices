name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Release tag must be vX.Y.Z'
          }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "version=$($env:RELEASE_TAG.Substring(1))" >> $env:GITHUB_OUTPUT
      - name: Check out release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - name: Check out exact tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          path: source
          persist-credentials: false
      - name: Install JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install Android build requirements
        run: |
          sdkmanager "platforms;android-36" "build-tools;34.0.0"
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed' }
      - name: Install verified Godot 4.7.2
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          Invoke-WebRequest 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953') {
            throw 'Godot archive checksum mismatch'
          }
          $directory = Join-Path $env:RUNNER_TEMP 'godot'
          Expand-Archive $archive $directory
          "GODOT_PATH=$(Join-Path $directory 'Godot_v4.7.2-stable_win64.exe')" >> $env:GITHUB_ENV
      - name: Test release packaging
        run: ./automation/tests/test_package_release.ps1
      - name: Build and test tagged source
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./source/publish.ps1 -Version $env:RELEASE_VERSION -GodotPath $env:GODOT_PATH -DryRun
      - name: Package verified release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $commit = git -C source rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve tagged commit' }
          ./automation/scripts/package-release.ps1 -AddonPath ./source/addons/syntaxcircus_games -Version $env:RELEASE_VERSION -OutputDirectory ./release-assets -SourceCommit $commit
      - name: Preserve tested assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            release-assets/${{ steps.version.outputs.version }}/SyntaxCircus.Godot.GamesServices-${{ steps.version.outputs.version }}.zip
            release-assets/${{ steps.version.outputs.version }}/manifest.json
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets
      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="release-assets/SyntaxCircus.Godot.GamesServices-$version.zip"
          manifest="release-assets/manifest.json"
          test -f "$archive"
          test -f "$manifest"
          gh release create "$RELEASE_TAG" "$archive" "$manifest" --verify-tag --title "$RELEASE_TAG" --generate-notes
